apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-community
  namespace: victoriametrics
spec:
  interval: 1h
  url: https://grafana-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: victoriametrics
spec:
  interval: 10m
  timeout: 15m
  dependsOn:
    - name: vmcluster
  chart:
    spec:
      chart: grafana
      version: 14.4.0
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: victoriametrics
  values:
    ingress:
      enabled: true
      ingressClassName: traefik
      hosts:
        - vmetrics.ozoniuss.com
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: victoriametrics
            type: prometheus
            orgId: 1
            url: http://vmcluster-victoria-metrics-cluster-vmselect.victoriametrics.svc.cluster.local:8481/select/0/prometheus/
            access: proxy
            isDefault: true
            updateIntervalSeconds: 10
            editable: true
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: true
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default
    dashboards:
      default:
        victoriametrics:
          gnetId: 11176
          revision: 65
          datasource: victoriametrics
        vmagent:
          gnetId: 12683
          revision: 43
          datasource: victoriametrics
        kubernetes:
          gnetId: 14205
          revision: 1
          datasource: victoriametrics
