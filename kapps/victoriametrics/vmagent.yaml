apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmagent
  namespace: victoriametrics
spec:
  interval: 10m
  dependsOn:
    - name: vmcluster
  chart:
    spec:
      chart: victoria-metrics-agent
      version: 0.51.0
      sourceRef:
        kind: HelmRepository
        name: vm
        namespace: victoriametrics
  values:
    remoteWrite:
      - url: http://vmcluster-victoria-metrics-cluster-vminsert.victoriametrics.svc.cluster.local:8480/insert/0/prometheus/
        urlRelabelConfig:
          - if: '{__name__=~"container_.*"}'
            source_labels: [pod]
            regex: "(.+)"
            target_label: pod_name
          - if: '{__name__=~"container_.*"}'
            source_labels: [container]
            regex: "(.+)"
            target_label: container_name
          - if: '{__name__=~"container_.*"}'
            target_label: name
            replacement: k8s_stub
          - if: '{__name__=~"container_.*"}'
            source_labels: [id]
            regex: '^/system\.slice/(.+)\.service$'
            target_label: systemd_service_name
