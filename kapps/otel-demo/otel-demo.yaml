apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: otel-demo
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-demo
  namespace: otel-demo
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: opentelemetry-demo
      version: 0.42.6
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: otel-demo
  # Fix for:
  # Fatal glibc error: This version of Amazon Linux
  # requires a newer ARM64 processor compliant with
  #  at least ARM architecture 8.2-a with Cryptographic
  #  extensions. On EC2 this is Graviton 2 or later.
  values:
    opensearch:
      image:
        tag: 2.9.0
      opensearchJavaOpts: "-Xms512m -Xmx512m"
      resources:
        requests:
          memory: 768Mi
        limits:
          memory: 1536Mi
      # rp41 has more RAM
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - rp41
    components:
      frontend:
        # needed with the ingress below to be able to send traces
        envOverrides:
          - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
            value: http://oteldemo.ozoniuss.com/otlp-http/v1/traces
      frontend-proxy:
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            # add this to your /etc/hosts to target your cluster
            - host: oteldemo.ozoniuss.com
              paths:
                - path: /
                  pathType: Prefix
                  port: 8080
      # no idea what the AI did here, trying to fix image server
      image-provider:
        imageOverride:
          repository: nginxinc/nginx-unprivileged
          tag: 1.29.3-trixie-otel
        envOverrides:
          - name: NGINX_ENVSUBST_TEMPLATE_DIR
            value: /static
          - name: NGINX_ENVSUBST_OUTPUT_DIR
            value: /etc/nginx
        mountedEmptyDirs:
          - name: static
            mountPath: /static
        initContainers:
          - name: copy-static
            image: ghcr.io/open-telemetry/demo:3.1.0-image-provider
            command:
              ["cp", "-r", "/static/.", "/nginx.conf.template", "/shared/"]
            volumeMounts:
              - name: static
                mountPath: /shared
