apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: otel-demo
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-demo
  namespace: otel-demo
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: opentelemetry-demo
      version: 0.42.6
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: otel-demo
