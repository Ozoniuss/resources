apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-telemetry
  namespace: otel-demo
spec:
  interval: 1h
  url: https://open-telemetry.github.io/opentelemetry-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: otel-demo
  namespace: otel-demo
spec:
  interval: 10m
  timeout: 15m
  chart:
    spec:
      chart: opentelemetry-demo
      version: 0.42.6
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: otel-demo
  # Fix for:
  # Fatal glibc error: This version of Amazon Linux
  # requires a newer ARM64 processor compliant with
  #  at least ARM architecture 8.2-a with Cryptographic
  #  extensions. On EC2 this is Graviton 2 or later.
  values:
    opensearch:
      image:
        tag: 2.9.0
    components:
      frontend-proxy:
        ingress:
          enabled: true
          ingressClassName: traefik
          hosts:
            # add this to your /etc/hosts to target your cluster
            - host: oteldemo.ozoniuss.com
              paths:
                - path: /
                  pathType: Prefix
                  port: 8080
